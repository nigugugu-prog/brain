<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede8;--dot:#c5bdb5;--white:#fff;--border:#e2ddd8;
  --text:#2a2825;--muted:#8a857e;--accent:#5b4fd4;--accent-l:#ece9ff;
  --sh1:0 1px 4px rgba(0,0,0,.08);--sh2:0 3px 12px rgba(0,0,0,.12);--sh3:0 6px 24px rgba(0,0,0,.14);
  --r:10px;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
  --tb-h:52px; /* toolbar height mobile */
}
html.dark{
  --bg:#1a1917;--dot:#3a3732;--white:#252320;--border:#3a3632;
  --text:#e8e4de;--muted:#7a756e;--accent:#7c6ef5;--accent-l:#2a2645;
  --sh1:0 1px 4px rgba(0,0,0,.35);--sh2:0 3px 12px rgba(0,0,0,.45);--sh3:0 6px 24px rgba(0,0,0,.55);
}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}

/* ── APP ── */
#app{width:100vw;height:100vh;position:relative;overflow:hidden}
#grid{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.2px);
  background-size:28px 28px}
#zone-layer,#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#zone-layer{z-index:1}
#canvas{z-index:2}
#arrow-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}

/* ── DESKTOP TOOLBAR (left side) ── */
#toolbar{
  position:fixed;left:14px;top:50%;transform:translateY(-50%);
  background:var(--white);border-radius:14px;padding:8px 6px;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:var(--sh3);z-index:1000;border:1px solid var(--border);
}
@media(pointer:coarse){#toolbar{display:none}}

.tbtn{
  width:36px;height:36px;border:none;background:transparent;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--muted);transition:background .12s,color .12s,transform .1s;position:relative;
}
.tbtn:hover{background:var(--bg);color:var(--text);transform:scale(1.05)}
.tbtn.active{background:var(--accent-l);color:var(--accent)}
.tbtn:active{transform:scale(.95)}
.tsep{height:1px;background:var(--border);margin:4px}
.tip{
  position:absolute;left:46px;background:#1a1916;color:#fff;
  font-size:11px;font-family:var(--mono);padding:4px 9px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;
  top:50%;transform:translateY(-50%);z-index:2000;
}
.tip::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-right-color:#1a1916}
.tbtn:hover .tip{opacity:1}

/* ── MOBILE BOTTOM TOOLBAR ── */
#mob-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--tb-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:var(--white);border-top:1px solid var(--border);
  z-index:1000;align-items:center;padding-left:4px;padding-right:4px;
  overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;touch-action:manipulation;
}
#mob-bar::-webkit-scrollbar{display:none}
@media(pointer:coarse){#mob-bar{display:flex}}
.mbtn{
  min-width:50px;height:46px;flex-shrink:0;border:none;background:transparent;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;
  transition:background .12s,color .12s;padding:0 6px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.mbtn svg{flex-shrink:0;pointer-events:none}
.mbtn:active,.mbtn.active{background:var(--accent-l);color:var(--accent)}
#mob-del,#mob-edit{opacity:0.4;transition:opacity .2s}
.mbtn-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;margin:0 2px}

/* ── BREADCRUMB ── */
#breadcrumb{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  padding:5px 12px;display:flex;align-items:center;gap:4px;
  font-size:12px;font-family:var(--mono);z-index:1000;
  box-shadow:var(--sh2);max-width:80vw;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .2s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#breadcrumb.visible{opacity:1;pointer-events:auto}
.bc-item{color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:130px;padding:2px 6px;border-radius:6px;transition:background .1s,color .1s}
.bc-item:hover{background:var(--bg);color:var(--text)}
.bc-item.cur{color:var(--text);font-weight:500;cursor:default}
.bc-item.cur:hover{background:transparent}
.bc-sep{color:var(--muted);opacity:.5;font-size:10px;flex-shrink:0}
.bc-back{display:flex;align-items:center;gap:5px;color:var(--accent);cursor:pointer;
  padding:2px 8px;border-radius:6px;transition:background .1s;font-weight:500;flex-shrink:0}
.bc-back:hover{background:var(--accent-l)}


/* arrow-from highlight */
.card.arrow-from{outline:2px dashed var(--accent);outline-offset:2px;}

/* ── FORMAT TOOLBAR ── */
#fmt-bar{
  position:fixed;left:14px;top:50%;transform:translateY(-50%);
  background:var(--white);border:1px solid var(--border);border-radius:14px;
  padding:8px 6px;display:none;flex-direction:column;gap:2px;
  box-shadow:var(--sh3);z-index:1001;
}
#fmt-bar.visible{display:flex}
.fbtn{
  width:36px;height:36px;border:none;background:transparent;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--muted);transition:background .12s,color .12s;
  position:relative;
}
.fbtn:hover{background:var(--bg);color:var(--text)}
.fbtn.on{background:var(--accent-l);color:var(--accent);font-weight:700}
.fsep{height:1px;background:var(--border);margin:3px 3px}
.fsize-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.fsize-val{
  width:36px;height:22px;border:none;border-radius:5px;background:var(--bg);
  color:var(--text);font-size:11px;font-family:var(--mono);text-align:center;
  outline:none;cursor:text;
}
.fsize-val:focus{background:var(--accent-l)}
/* note-card contenteditable */
.note-card .note-ce{
  min-height:64px;font-size:13px;line-height:1.55;color:var(--text);
  outline:none;word-break:break-word;white-space:pre-wrap;
  padding:12px 14px;cursor:text;
}
html.dark .note-card .note-ce{color:#e8e4de}
.note-card.editing .note-ce{pointer-events:auto}
.note-card .note-ce:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}

/* ── CARDS ── */
.card{
  position:absolute;cursor:grab;border-radius:var(--r);
  box-shadow:var(--sh1);user-select:none;transition:box-shadow .15s;touch-action:none;
}
.card:hover{box-shadow:var(--sh2)}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--sh2)}
.card textarea,.card input[type=text]{
  pointer-events:none;cursor:inherit;display:block;width:100%;
  background:transparent;border:none;outline:none;resize:none;
  font-family:var(--font);color:var(--text);line-height:1.55;
}
.card.editing textarea,.card.editing input[type=text]{pointer-events:auto;cursor:text}
/* Note */
.note-card{min-width:160px}
.note-card .cbody{padding:12px 14px}
.note-card textarea{font-size:13px;min-height:64px}
/* Note dark */
html.dark .note-card textarea{color:#e8e4de}
html.dark .note-card[data-nci="0"]{background:#3d3a1a!important}
html.dark .note-card[data-nci="1"]{background:#1a3020!important}
html.dark .note-card[data-nci="2"]{background:#1a2535!important}
html.dark .note-card[data-nci="3"]{background:#3a1a25!important}
html.dark .note-card[data-nci="4"]{background:#2e1a38!important}
html.dark .note-card[data-nci="5"]{background:#3a3018!important}
html.dark .note-card[data-nci="6"]{background:#38201a!important}
html.dark .note-card[data-nci="7"]{background:#1a2e30!important}
/* Text */
.text-card{background:transparent!important;box-shadow:none!important;min-width:120px}
.text-card:hover{box-shadow:none!important}
.text-card .cbody{padding:4px 6px}
.text-card textarea{font-size:22px;font-weight:600;color:var(--text);min-height:36px;letter-spacing:-.02em}
/* Image */
.image-card{background:var(--white);overflow:hidden;min-width:140px}
.img-ph{width:150px;height:110px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:12px;background:#f7f4f0;border-radius:var(--r)}
html.dark .img-ph{background:#2a2825}
.image-card img{width:100%;display:block;border-radius:var(--r)}
/* Link */
.link-card{background:var(--white);border:1px solid var(--border);min-width:180px}
html.dark .link-card{background:#252320}
.link-card .cbody{padding:12px 14px}
.link-domain{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.link-url-t{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px}
.link-icon{font-size:20px;margin-bottom:6px}
/* Todo */
.todo-card{background:var(--white);border:1px solid var(--border);min-width:195px}
html.dark .todo-card{background:#252320}
.todo-head{padding:10px 13px 6px;font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.todo-list{padding:6px 10px}
.todo-item{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;color:var(--text)}
.todo-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex-shrink:0}
.todo-item.done span{text-decoration:line-through;color:var(--muted)}
.todo-new-wrap{padding:3px 12px 10px}
.todo-new{width:100%;border:none;outline:none;font-size:13px;color:var(--muted);background:transparent;font-family:var(--font)}
/* Board */
.board-card{background:var(--white);border:1px solid #d8d4f8;min-width:155px;min-height:95px;display:flex;flex-direction:column}
html.dark .board-card{border-color:#3a3560}
.board-card-head{padding:10px 11px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ede9ff}
html.dark .board-card-head{border-color:#2a2645}
.board-ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.board-title-inp{font-size:12px;font-weight:600;color:var(--text);flex:1;border:none;outline:none;background:transparent;font-family:var(--font);pointer-events:none;cursor:grab}
.board-card.editing .board-title-inp{pointer-events:auto;cursor:text}
.board-preview{flex:1;margin:6px 8px 8px;border-radius:7px;background:#f5f3ff;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;padding:5px;overflow:hidden;min-height:55px;position:relative}
html.dark .board-preview{background:#1e1c2a}
.board-thumb{border-radius:4px;background:#ddd8f8;opacity:.7}
html.dark .board-thumb{background:#3a3560;opacity:.6}
.board-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(91,79,212,.08);border-radius:var(--r);
  opacity:0;transition:opacity .15s;pointer-events:none;
  font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.board-card:hover .board-hint{opacity:1}
/* Swatches */
.note-colors{display:none;position:absolute;top:-36px;left:0;
  background:var(--white);border-radius:8px;padding:5px 6px;
  box-shadow:var(--sh2);gap:5px;z-index:500;border:1px solid var(--border)}
.card.sel .note-colors{display:flex}
.swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}
.swatch:hover{transform:scale(1.2)}
.swatch.active{border-color:var(--accent)}
/* Resize */
.resize-h{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:se-resize;opacity:0;transition:opacity .15s}
.card.sel .resize-h{opacity:1}
.resize-h::after{content:'';position:absolute;right:3px;bottom:3px;width:6px;height:6px;
  border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}

/* ── ZONE ── */
.zone{position:absolute;border-radius:16px;cursor:move;user-select:none;z-index:0;touch-action:none;transition:box-shadow .15s}
.zone:hover{box-shadow:0 0 0 2px rgba(91,79,212,.3)}
.zone.sel-zone{box-shadow:0 0 0 2px var(--accent)}
.zone-lbl{position:absolute;top:12px;left:16px;font-size:13px;font-weight:600;opacity:.6;
  pointer-events:none;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.zone-rh{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:se-resize;opacity:0}
.zone.sel-zone .zone-rh{opacity:1}
.zone-rh::after{content:'';position:absolute;right:4px;bottom:4px;width:7px;height:7px;
  border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}
#zone-ghost{position:fixed;border:2px dashed var(--accent);border-radius:14px;pointer-events:none;display:none;z-index:9999;opacity:.5}
/* Zone picker */
#zpick{position:fixed;background:var(--white);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;box-shadow:var(--sh3);z-index:3000;display:none;min-width:210px}
.zp-ttl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.zp-sw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.zp-s{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s;outline:1px solid rgba(0,0,0,.12)}
.zp-s:hover{transform:scale(1.15)}
.zp-s.active{border-color:var(--accent)}
.zp-lr{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.zp-li{flex:1;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--font);color:var(--text);background:var(--bg);outline:none}
.zp-lock-btn{padding:4px 10px;font-size:12px;color:var(--accent);border:1px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;font-family:var(--font);transition:background .1s;}
.zp-lock-btn:hover{background:var(--accent-l)}
.zp-dl{padding:4px 10px;font-size:12px;color:#c04040;border:1px solid #f0b0b0;border-radius:6px;cursor:pointer;background:transparent;font-family:var(--font)}
.zp-dl:hover{background:#fff0f0}

/* ── LONG PRESS MENU (mobile) ── */
#lp-menu{
  position:fixed;background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:6px 0;box-shadow:var(--sh3);
  z-index:4000;min-width:160px;display:none;
}
.lp-item{padding:12px 16px;font-size:14px;color:var(--text);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .1s;}
.lp-item:active{background:var(--bg);}
.lp-item.red{color:#c04040;}
.lp-sep{height:1px;background:var(--border);margin:3px 0;}

/* ── BOARD TRANSITION ── */
#board-tr{position:fixed;inset:0;background:var(--bg);z-index:5000;opacity:0;pointer-events:none;transition:opacity .18s}
#board-tr.active{opacity:1;pointer-events:all}

/* ── CTX MENU ── */
#ctx{position:fixed;background:var(--white);border-radius:12px;padding:6px 0;
  box-shadow:var(--sh3);border:1px solid var(--border);z-index:2000;min-width:160px;display:none}
.ci{padding:8px 14px;font-size:13px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .1s}
.ci:hover{background:var(--bg)}
.csep{height:1px;background:var(--border);margin:4px 0}
.ci.red{color:#c04040}

/* ── STATUS BAR ── */
#sbar{
  position:fixed;bottom:0;left:0;right:0;height:30px;
  background:var(--white);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:14px;
  font-size:11px;color:var(--muted);z-index:999;font-family:var(--mono);
}
@media(pointer:coarse){#sbar{display:none}}
#sdot{width:7px;height:7px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0}
#sdot.saved{background:#4caf50}
#sdot.saving{background:#ff9800;animation:blink .8s infinite}
#sdot.err{background:#e44}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* mobile sync badge */
#mob-sync{
  position:fixed;top:12px;right:12px;z-index:1001;
  background:var(--white);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:11px;font-family:var(--mono);color:var(--muted);
  display:none;align-items:center;gap:6px;box-shadow:var(--sh1);
}
@media(pointer:coarse){#mob-sync{display:flex}}

/* ── TOAST ── */
#toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);
  background:#1a1916;color:#fff;font-size:12px;font-family:var(--mono);
  padding:7px 16px;border-radius:8px;z-index:3000;display:none;white-space:nowrap}
@media(pointer:coarse){#toast{bottom:calc(var(--tb-h) + env(safe-area-inset-bottom, 0px) + 10px)}}

/* ── MINIMAP ── */
#mm{position:fixed;bottom:38px;right:14px;width:108px;height:68px;
  background:rgba(255,255,255,.9);border-radius:8px;border:1px solid var(--border);
  box-shadow:var(--sh1);z-index:1000;overflow:hidden}
html.dark #mm{background:rgba(30,28,26,.92)}
@media(pointer:coarse){#mm{display:none}}

/* ── MOBILE ADD FAB ── */
#fab{
  display:none;position:fixed;right:16px;bottom:calc(var(--tb-h) + env(safe-area-inset-bottom, 0px) + 16px);
  width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;
  border:none;font-size:24px;cursor:pointer;z-index:1001;
  box-shadow:0 4px 16px rgba(91,79,212,.4);transition:transform .15s;
  align-items:center;justify-content:center;
}
#fab:active{transform:scale(.92)}
@media(pointer:coarse){#fab{display:flex}}

/* ── MOBILE CARD SHEET ── */
#card-sheet{
  position:fixed;inset:0;z-index:4000;display:none;touch-action:manipulation;
}
#card-sheet.open{display:block}
#card-sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#card-sheet-inner{
  position:absolute;bottom:0;left:0;right:0;background:var(--white);
  border-radius:20px 20px 0 0;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 28px);
}
#csh-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 14px;}
#csh-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;padding-left:2px;}
#csh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cst-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 8px 12px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg);cursor:pointer;font-size:11px;color:var(--text);font-family:var(--font);
  transition:background .1s,transform .1s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.cst-btn:active{background:var(--accent-l);color:var(--accent);transform:scale(.94)}
.cst-btn svg{color:var(--muted)}

/* No-select during pan/drag */
.nosel{user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="app">
  <div id="grid"></div>
  <svg id="arrow-layer"><defs>
  <marker id="ah-light" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L8,3.5 z" fill="#1a1917"/>
  </marker>
  <marker id="ah-dark" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L8,3.5 z" fill="#e8e4de"/>
  </marker>
</defs></svg>

<script>
'use strict';

// ── CONFIG ────────────────────────────────────────────────────
const BOARD_ID = 'main'; // single shared board
const LS_KEY = 'milanote_v4';

// Netlify Function経由（同一オリジン・CORSなし）
const FN = '/.netlify/functions/sb';

async function sbFetch(method, body){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(FN, opts);
  const text = await res.text();
  if(!res.ok) throw new Error('HTTP '+res.status+': '+text);
  return text;
}

// ── CONSTS ────────────────────────────────────────────────────
const NOTE_COLORS = ['#fffde7','#e8f5e9','#e3f2fd','#fce4ec','#f3e5f5','#fff8e1','#fbe9e7','#e0f7fa'];
const BOARD_COLORS = ['#ece9ff','#e4f4ff','#e4ffe8','#fff4e4','#ffe4f4'];
const ZONE_LIGHT = ['rgba(255,220,180,.35)','rgba(180,230,180,.35)','rgba(180,210,255,.35)','rgba(255,180,210,.35)','rgba(220,180,255,.35)','rgba(255,255,180,.35)','rgba(180,245,240,.35)','rgba(230,210,180,.35)'];
const ZONE_DARK  = ['rgba(120,80,30,.30)','rgba(30,90,50,.30)','rgba(30,60,120,.30)','rgba(100,30,60,.30)','rgba(70,30,110,.30)','rgba(100,90,20,.30)','rgba(20,90,80,.30)','rgba(90,65,30,.30)'];

// ── DOM ───────────────────────────────────────────────────────
const app      = document.getElementById('app');
const canvasEl = document.getElementById('canvas');
const asvg     = document.getElementById('arrow-layer');
const zoneLayer= document.getElementById('zone-layer');
const ctxMenu  = document.getElementById('ctx');
const zpick    = document.getElementById('zpick');
const zpSw     = document.getElementById('zp-sw');
const zpLi     = document.getElementById('zp-li');
const zpDl     = document.getElementById('zp-dl');
const zGhost   = document.getElementById('zone-ghost');
const bcEl     = document.getElementById('breadcrumb');
const boardTr  = document.getElementById('board-tr');
const sdot     = document.getElementById('sdot');
const stxt     = document.getElementById('stxt');
const zoomTxt  = document.getElementById('zoom-txt');
const depthTxt = document.getElementById('depth-txt');
const toastEl  = document.getElementById('toast');
const mmCv     = document.getElementById('mm');
const mmCtx    = mmCv.getContext('2d');
const mobSdot  = document.getElementById('mob-sdot');
const mobStxt  = document.getElementById('mob-stxt');
const htmlEl   = document.documentElement;

// ── STATE ─────────────────────────────────────────────────────
let pan={x:80,y:60},zoom=1,tool='select',isDark=false;
let selected=null,arrowFrom=null,ctxPos={x:0,y:0};
let cards=[],arrows=[],cardId=0,colorIdx=0;
let zones=[],zoneId=0,selectedZone=null;
let isPanning=false,panStart={x:0,y:0};
let isDragging=false,dragCard=null,dragOff={x:0,y:0};
let isResizing=false,resizeCard=null,resizeStart={};
let isDraggingZone=false,dragZone=null,dragZoneOff={x:0,y:0};
let isResizingZone=false,resizeZone=null,resizeZoneStart={};
let isDrawingZone=false,drawZoneStart={x:0,y:0};
let boardStack=[],currentBoardId='root',allBoardData={};
let saveTimer=null,syncTimeout=null;
// touch
let touches={},lastPinchDist=0,lastTapTime=0,lastTapPos={x:0,y:0};

// ── SAVE STATUS ───────────────────────────────────────────────
function setSave(s,msg){
  const dot=sdot, txt=stxt, md=mobSdot, mt=mobStxt;
  dot.className=s; md.style.background=s==='saved'?'#4caf50':s==='saving'?'#ff9800':s==='err'?'#e44':'#ccc';
  const m=msg||(s==='saved'?'同期済み':s==='saving'?'同期中...':s==='err'?'同期失敗':'未保存');
  txt.textContent=mt.textContent=m;
}

// ── SERIALIZATION ─────────────────────────────────────────────
function serializeBoard(){
  return {
    pan:{...pan},zoom,
    zones:zones.map(z=>({...z.data})),
    cards:cards.map(c=>{
      const d={...c.data};
      const ta=c.el.querySelector('textarea');
      if(ta)d.text=ta.value;
      const bi=c.el.querySelector('.board-title-inp');
      if(bi)d.title=bi.value;
      if(c.data.type==='todo')
        d.todos=Array.from(c.el.querySelectorAll('.todo-item')).map(ti=>({
          text:ti.querySelector('span').textContent,done:ti.classList.contains('done')
        }));
      d.x=parseFloat(c.el.style.left);d.y=parseFloat(c.el.style.top);
      d.w=c.el.offsetWidth; d.h=c.el.offsetHeight;
      const ce=c.el.querySelector('.note-ce');
      if(ce){d.html=ce.innerHTML;d.text=ce.innerText;if(ce.style.minHeight)d.taH=ce.style.minHeight;}
      else{const ta2=c.el.querySelector('textarea');if(ta2&&ta2.style.height)d.taH=ta2.style.height;}
      return d;
    }),
    arrows:arrows.map(a=>({fromId:a.fromId,toId:a.toId}))
  };
}

function fullBlob(){
  flushCurrent();
  return {cardId,zoneId,colorIdx,boardStack:boardStack.map(f=>({boardId:f.boardId,title:f.title})),allBoardData,dark:isDark};
}

function flushCurrent(){
  allBoardData[currentBoardId]=serializeBoard();
}

// ── SUPABASE SYNC ─────────────────────────────────────────────
let lastSavedJSON='';

async function syncToSupabase(){
  setSave('saving');
  const blob=fullBlob();
  const json=JSON.stringify(blob);
  if(json===lastSavedJSON){setSave('saved');return;}
  try{
    await sbFetch('POST', {data: blob});
    lastSavedJSON=json;
    localStorage.setItem(LS_KEY,json);
    setSave('saved');
  }catch(e){
    localStorage.setItem(LS_KEY,json);
    setSave('err','同期失敗');
    console.error('sync error:', e);
  }
}

function scheduleSave(){
  setSave('unsaved','未保存');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(syncToSupabase,1500);
}

async function loadData(){
  setSave('saving','読み込み中...');
  try{
    const txt=await sbFetch('GET', null);
    const rows=JSON.parse(txt);
    if(!rows||rows.length===0) throw new Error('no data');
    const d=rows[0].data;
    restoreBlob(d);
    lastSavedJSON=JSON.stringify(d);
    setSave('saved');
    showToast('クラウドから読み込みました ☁️');
  }catch(e){
    // fallback to localStorage
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      try{restoreBlob(JSON.parse(raw));setSave('saved','ローカルから復元');}
      catch{addDemoCards();}
    }else{addDemoCards();}
  }
}

function restoreBlob(blob){
  if(!blob)return;
  cardId=blob.cardId||0; zoneId=blob.zoneId||0; colorIdx=blob.colorIdx||0;
  allBoardData=blob.allBoardData||{};
  boardStack=[];currentBoardId='root';
  isDark=!!blob.dark;
  applyDark(isDark);
  const bd=allBoardData['root'];
  if(bd){if(bd.pan)pan=bd.pan;if(bd.zoom)zoom=bd.zoom;renderBoard(bd);}
  else{clearAll();updateTransform();}
  updateBreadcrumb();
}

// ── RENDER BOARD ──────────────────────────────────────────────
function renderBoard(bd){
  clearAll();
  (bd.zones||[]).forEach(d=>{if(d.id>=zoneId)zoneId=d.id+1;buildZone(d);});
  (bd.cards||[]).forEach(d=>buildCard(d.type,d.x,d.y,d,false));
  (bd.arrows||[]).forEach(a=>{
    const fc=cards.find(c=>c.data.id===a.fromId),tc=cards.find(c=>c.data.id===a.toId);
    if(fc&&tc)arrows.push({fromId:a.fromId,toId:a.toId,from:fc.el,to:tc.el});
  });
  selectCard(null);updateTransform();
}

function clearAll(){
  cards.forEach(c=>canvasEl.removeChild(c.el));cards=[];
  arrows=[];selected=null;
  zones.forEach(z=>zoneLayer.removeChild(z.el));zones=[];selectedZone=null;
  drawArrows();drawMM();
}

// ── BUILD CARD ────────────────────────────────────────────────
function buildCard(type,x,y,saved={},doSave=true){
  const id=saved.id!==undefined?saved.id:++cardId;
  if(id>=cardId)cardId=id+1;
  const el=document.createElement('div');
  el.className='card'; el.dataset.id=id;
  el.style.left=x+'px'; el.style.top=y+'px';
  const data={id,type,...saved,x,y};

  if(type==='note'){
    el.classList.add('note-card');
    const ci=saved.colorIdx!==undefined?saved.colorIdx:(colorIdx++%NOTE_COLORS.length);
    data.colorIdx=ci; data.color=NOTE_COLORS[ci];
    el.style.background=NOTE_COLORS[ci]; el.dataset.nci=ci;
    el.style.width=(saved.w||175)+'px'; if(saved.h)el.style.minHeight=saved.h+'px';
    el.innerHTML=`<div class="note-colors">${NOTE_COLORS.map((c,i)=>`<div class="swatch${i===ci?' active':''}" style="background:${c}" data-cidx="${i}"></div>`).join('')}</div><div class="note-ce" contenteditable="false" data-ph="メモを入力...">${saved.html||escHtml(saved.text||'')}</div><div class="resize-h"></div>`;
    if(saved.taH){const ce=el.querySelector('.note-ce');if(ce)ce.style.minHeight=saved.taH;}
    el.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('mousedown',e=>{e.stopPropagation();const i=+sw.dataset.cidx;el.style.background=NOTE_COLORS[i];data.colorIdx=i;data.color=NOTE_COLORS[i];el.dataset.nci=i;el.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s===sw));scheduleSave();});
      sw.addEventListener('touchstart',e=>{e.stopPropagation();e.preventDefault();sw.dispatchEvent(new MouseEvent('mousedown'));},{passive:false});
    });

  }else if(type==='text'){
    el.classList.add('text-card');
    el.style.width=(saved.w||230)+'px'; if(saved.h)el.style.minHeight=saved.h+'px';
    el.innerHTML=`<div class="cbody"><textarea placeholder="見出しテキスト...">${saved.text||''}</textarea></div><div class="resize-h"></div>`;
    if(saved.taH){const ta=el.querySelector('textarea');if(ta)ta.style.height=saved.taH;}

  }else if(type==='image'){
    el.classList.add('image-card');
    el.style.width=(saved.w||160)+'px';
    if(saved.imgSrc){el.innerHTML=`<img src="${saved.imgSrc}" alt=""><div class="resize-h"></div>`;}
    else{
      el.innerHTML=`<div class="img-ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15L16 10L5 21"/></svg><span>画像をドロップ/タップ</span></div><div class="resize-h"></div>`;
      el.ondragover=e=>e.preventDefault();
      el.ondrop=e=>{e.preventDefault();loadImageFile(e.dataTransfer.files[0],el,data);};
      el.querySelector('.img-ph')?.addEventListener('click',()=>{const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.onchange=e=>loadImageFile(e.target.files[0],el,data);fi.click();});
    }

  }else if(type==='link'){
    el.classList.add('link-card');
    const url=saved.url||(()=>{const u=prompt('URLを入力:');return u||'https://example.com';})();
    data.url=url;
    const domain=url.replace(/^https?:\/\//,'').split('/')[0];
    el.style.width=(saved.w||190)+'px';
    el.innerHTML=`<div class="cbody"><div class="link-icon">🔗</div><div class="link-domain">${domain}</div><div class="link-url-t">${url}</div><input class="link-url-edit" type="text" value="${url}" placeholder="https://..." style="display:none;width:100%;margin-top:4px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;"></div><div class="resize-h"></div>`;
    // editing on: show url input; editing off: update display
    const observer=new MutationObserver(()=>{
      const isEd=el.classList.contains('editing');
      const inp=el.querySelector('.link-url-edit');
      const domEl=el.querySelector('.link-domain');
      const urlEl=el.querySelector('.link-url-t');
      inp.style.display=isEd?'block':'none';
      if(isEd){inp.focus();}
      else{
        const newUrl=inp.value.trim()||url;
        data.url=newUrl;
        domEl.textContent=newUrl.replace(/^https?:\/\//,'').split('/')[0];
        urlEl.textContent=newUrl;
      }
    });
    observer.observe(el,{attributes:true,attributeFilter:['class']});
    el.querySelector('.link-url-edit').addEventListener('input',scheduleSave);
    el.querySelector('.link-url-edit').addEventListener('mousedown',e=>e.stopPropagation());
    el.querySelector('.link-url-edit').addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
    el.querySelector('.link-url-t').addEventListener('click',e=>{if(!el.classList.contains('editing'))window.open(data.url,'_blank');});
    // URL を開くのは右クリックメニューから（dblclickは編集モードに統一）

  }else if(type==='todo'){
    el.classList.add('todo-card');
    const todos=saved.todos||[{text:'タスク 1',done:false},{text:'タスク 2',done:false}];
    el.style.width=(saved.w||205)+'px'; if(saved.h)el.style.minHeight=saved.h+'px';
    el.innerHTML=`<div class="todo-head">TO-DO LIST</div><div class="todo-list">${todos.map(t=>`<div class="todo-item${t.done?' done':''}"><input type="checkbox"${t.done?' checked':''}><span>${t.text}</span></div>`).join('')}</div><div class="todo-new-wrap"><input class="todo-new" type="text" placeholder="+ 追加..."></div><div class="resize-h"></div>`;
    el.querySelectorAll('.todo-item input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change',()=>{cb.closest('.todo-item').classList.toggle('done',cb.checked);scheduleSave();});
      cb.addEventListener('mousedown',e=>e.stopPropagation());
      cb.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
    });
    const todoNewInp=el.querySelector('.todo-new');
    todoNewInp.addEventListener('mousedown',e=>e.stopPropagation());
    todoNewInp.addEventListener('touchstart',e=>{e.stopPropagation();todoNewInp.focus();},{passive:true});
    todoNewInp.addEventListener('click',e=>{e.stopPropagation();todoNewInp.focus();});
    todoNewInp.addEventListener('keydown',e=>{
      if(e.key!=='Enter'||!e.target.value.trim())return;
      const item=document.createElement('div');item.className='todo-item';
      item.innerHTML=`<input type="checkbox"><span>${e.target.value.trim()}</span>`;
      const cb2=item.querySelector('input');
      cb2.addEventListener('change',()=>{item.classList.toggle('done',cb2.checked);scheduleSave();});
      cb2.addEventListener('mousedown',e=>e.stopPropagation());
      cb2.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
      el.querySelector('.todo-list').appendChild(item);e.target.value='';scheduleSave();e.stopPropagation();
    });

  }else if(type==='board'){
    el.classList.add('board-card');
    const bc=BOARD_COLORS[Math.floor(Math.random()*BOARD_COLORS.length)];
    el.style.width=(saved.w||170)+'px'; el.style.height=(saved.h||130)+'px';
    const childId='board_'+id, childData=allBoardData[childId];
    const tc=childData?Math.min(4,childData.cards?.length||0):0;
    const thumbs=Array.from({length:4},(_,i)=>`<div class="board-thumb" style="${i<tc?'background:#c5bff5;opacity:.8;':''}"></div>`).join('');
    el.innerHTML=`<div class="board-card-head"><div class="board-ico" style="background:${bc};">⊞</div><input type="text" class="board-title-inp" value="${saved.title||'新しいボード'}"></div><div class="board-preview">${thumbs}<div class="board-hint">ダブルクリックで開く →</div></div><div class="resize-h"></div>`;
    const titleInp=el.querySelector('.board-title-inp');
    // タイトル入力欄: 常時編集可能
    titleInp.style.pointerEvents='auto';
    titleInp.style.cursor='text';
    titleInp.addEventListener('input',scheduleSave);
    titleInp.addEventListener('mousedown',e=>e.stopPropagation());
    titleInp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
    titleInp.addEventListener('click',e=>e.stopPropagation());
    // ダブルクリックはpreview部分のみ → enterBoard
    el.querySelector('.board-preview').addEventListener('dblclick',e=>{e.stopPropagation();enterBoard(el);});
    el.querySelector('.board-preview').addEventListener('touchstart',e=>{
      const now=Date.now(),t=e.touches[0];
      if(now-el._lastTap<350&&Math.hypot(t.clientX-(el._lastTapX||0),t.clientY-(el._lastTapY||0))<40){
        e.stopPropagation();e.preventDefault();enterBoard(el);el._lastTap=0;return;
      }
      el._lastTap=now;el._lastTapX=t.clientX;el._lastTapY=t.clientY;
    },{passive:false});
  }

  const ta=el.querySelector('textarea');
  if(ta)ta.addEventListener('input',scheduleSave);
  const ceForSave=el.querySelector('.note-ce');
  if(ceForSave)ceForSave.addEventListener('input',scheduleSave);
  if(type!=='board'){
    el.addEventListener('dblclick',e=>{
      e.stopPropagation();
      focusCardForEdit(el);
    });
  }

  el.addEventListener('mousedown',onCardDown);
  el.addEventListener('touchstart',onCardTouch,{passive:false});
  el.addEventListener('touchend',onCardTouchEnd,{passive:false});
  setupResize(el);
  canvasEl.appendChild(el);
  cards.push({el,data});
  selectCard(el);
  if(doSave)scheduleSave();
  return el;
}

function loadImageFile(f,el,data){
  if(!f||!f.type.startsWith('image/'))return;
  const r=new FileReader();
  r.onload=ev=>{data.imgSrc=ev.target.result;el.innerHTML=`<img src="${ev.target.result}" alt=""><div class="resize-h"></div>`;setupResize(el);scheduleSave();};
  r.readAsDataURL(f);
}

// ── ZONE ──────────────────────────────────────────────────────
function buildZone(d){
  const el=document.createElement('div');
  el.className='zone'; el.dataset.zid=d.id;
  el.style.left=d.x+'px'; el.style.top=d.y+'px';
  el.style.width=d.w+'px'; el.style.height=d.h+'px';
  applyZoneColor(el,d.colorIdx||0);
  const lbl=document.createElement('div');lbl.className='zone-lbl';lbl.textContent=d.label||'';
  lbl.style.color=isDark?'#e8e4de':'#2a2825';el.appendChild(lbl);
  const rh=document.createElement('div');rh.className='zone-rh';el.appendChild(rh);
  rh.addEventListener('mousedown',e=>{if(d.locked)return;e.stopPropagation();isResizingZone=true;resizeZone=el;resizeZoneStart={x:e.clientX,y:e.clientY,w:d.w,h:d.h};});
  rh.addEventListener('touchstart',e=>{if(d.locked)return;e.stopPropagation();const t=e.touches[0];isResizingZone=true;resizeZone=el;resizeZoneStart={x:t.clientX,y:t.clientY,w:d.w,h:d.h};},{passive:false});
  el.addEventListener('mousedown',e=>{if(e.target===rh)return;e.stopPropagation();selectZone(el);if(d.locked)return;isDraggingZone=true;dragZone=el;const p=s2c(e.clientX,e.clientY);dragZoneOff={x:p.x-d.x,y:p.y-d.y};});
  el.addEventListener('touchstart',e=>{if(e.target===rh)return;e.stopPropagation();selectZone(el);if(d.locked)return;isDraggingZone=true;dragZone=el;const t=e.touches[0],p=s2c(t.clientX,t.clientY);dragZoneOff={x:p.x-d.x,y:p.y-d.y};},{passive:false});
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();selectZone(el);openZonePicker(e.clientX,e.clientY,d);});
  el.addEventListener('dblclick',e=>{e.stopPropagation();selectZone(el);openZonePicker(e.clientX,e.clientY,d);});
  // ロック状態の初期反映
  if(d.locked){
    const rh2=el.querySelector('.zone-rh');if(rh2)rh2.style.display='none';
    el.style.cursor='default';
    const lbl2=el.querySelector('.zone-lbl');
    if(lbl2&&d.label&&!d.label.startsWith('🔒'))lbl2.textContent='🔒 '+d.label;
  }
  zoneLayer.appendChild(el);
  zones.push({el,data:d});
  return el;
}

function applyZoneColor(el,ci){el.style.background=isDark?ZONE_DARK[ci]:ZONE_LIGHT[ci];}
function refreshZoneColors(){zones.forEach(({el,data:d})=>{applyZoneColor(el,d.colorIdx||0);const lbl=el.querySelector('.zone-lbl');if(lbl)lbl.style.color=isDark?'#e8e4de':'#2a2825';});}
function selectZone(el){if(selectedZone)selectedZone.classList.remove('sel-zone');selectedZone=el;if(el)el.classList.add('sel-zone');}

function openZonePicker(cx,cy,d){
  zpSw.innerHTML='';
  ZONE_LIGHT.forEach((c,i)=>{const s=document.createElement('div');s.className='zp-s'+(i===(d.colorIdx||0)?' active':'');s.style.background=c;s.dataset.ci=i;s.addEventListener('click',()=>{d.colorIdx=i;applyZoneColor(selectedZone,i);zpSw.querySelectorAll('.zp-s').forEach(x=>x.classList.toggle('active',+x.dataset.ci===i));scheduleSave();});zpSw.appendChild(s);});
  zpLi.value=d.label||'';
  zpLi.oninput=()=>{d.label=zpLi.value;const l=selectedZone?.querySelector('.zone-lbl');if(l)l.textContent=zpLi.value;scheduleSave();};
  const lockBtn=document.getElementById('zp-lock');
  lockBtn.textContent=d.locked?'🔒 固定解除':'🔓 固定する';
  lockBtn.onclick=()=>{
    d.locked=!d.locked;
    lockBtn.textContent=d.locked?'🔒 固定解除':'🔓 固定する';
    // ロック中はリサイズハンドルを隠す
    const rh=selectedZone?.querySelector('.zone-rh');
    if(rh)rh.style.display=d.locked?'none':'';
    selectedZone?.style.setProperty('cursor',d.locked?'default':'move');
    // ロックアイコンをラベルに反映
    const lbl=selectedZone?.querySelector('.zone-lbl');
    if(lbl)lbl.textContent=(d.locked?'🔒 ':'')+d.label;
    scheduleSave();
  };
  zpDl.onclick=()=>{if(!selectedZone)return;zoneLayer.removeChild(selectedZone);zones=zones.filter(z=>z.el!==selectedZone);selectedZone=null;zpick.style.display='none';scheduleSave();};
  const r=app.getBoundingClientRect();
  zpick.style.left=Math.min(cx,r.right-230)+'px'; zpick.style.top=Math.min(cy,r.bottom-170)+'px';
  zpick.style.display='block';
}

// ── BOARD NAVIGATION ──────────────────────────────────────────
function enterBoard(cardEl){
  const co=cards.find(c=>c.el===cardEl);if(!co)return;
  const boardId='board_'+co.data.id;
  const title=cardEl.querySelector('.board-title-inp')?.value||'ボード';
  flushCurrent();
  boardStack.push({boardId:currentBoardId,title:boardStack.length===0?'ホーム':title,pan:{...pan},zoom});
  boardTr.classList.add('active');
  setTimeout(()=>{
    currentBoardId=boardId;pan={x:80,y:60};zoom=1;
    const bd=allBoardData[boardId];
    if(bd){if(bd.pan)pan=bd.pan;if(bd.zoom)zoom=bd.zoom;renderBoard(bd);}
    else{clearAll();updateTransform();}
    updateBreadcrumb();boardTr.classList.remove('active');
  },180);
}

function goBack(){
  if(!boardStack.length)return;
  flushCurrent();const prev=boardStack.pop();
  boardTr.classList.add('active');
  setTimeout(()=>{
    currentBoardId=prev.boardId;pan=prev.pan||{x:80,y:60};zoom=prev.zoom||1;
    const bd=allBoardData[currentBoardId];
    if(bd)renderBoard(bd);else{clearAll();updateTransform();}
    updateBreadcrumb();boardTr.classList.remove('active');scheduleSave();
  },180);
}

function updateBreadcrumb(){
  const dep=boardStack.length;
  depthTxt.style.display=dep>0?'':'none';depthTxt.textContent='深さ '+dep;
  if(dep===0){bcEl.classList.remove('visible');bcEl.innerHTML='';return;}
  bcEl.classList.add('visible');bcEl.innerHTML='';

  function bcTap(el, fn){
    el.addEventListener('touchend', e=>{ e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
    el.addEventListener('click', e=>{ e.stopPropagation(); fn(); });
  }

  const back=document.createElement('span');
  back.className='bc-back';
  back.innerHTML='← 戻る';
  bcTap(back, goBack);
  bcEl.appendChild(back);

  const sep=document.createElement('span');sep.className='bc-sep';sep.textContent='|';bcEl.appendChild(sep);

  boardStack.forEach((f,i)=>{
    const sp=document.createElement('span');
    sp.className='bc-item';
    sp.textContent=i===0?'🏠 ホーム':f.title||'ボード';
    bcTap(sp, ()=>{
      if(i===boardStack.length-1){ goBack(); }
      else{ while(boardStack.length>i+1){flushCurrent();boardStack.pop();} goBack(); }
    });
    bcEl.appendChild(sp);
    const s2=document.createElement('span');s2.className='bc-sep';s2.textContent='›';bcEl.appendChild(s2);
  });

  const cur=document.createElement('span');cur.className='bc-item cur';
  const pb=allBoardData[boardStack[boardStack.length-1]?.boardId];
  const bc2=pb?.cards?.find(c=>'board_'+c.id===currentBoardId);
  cur.textContent=bc2?.title||'ボード';bcEl.appendChild(cur);
}

// ── INTERACTION ───────────────────────────────────────────────
function setupResize(el){
  const h=el.querySelector('.resize-h');if(!h)return;
  h.addEventListener('mousedown',e=>{e.stopPropagation();isResizing=true;resizeCard=el;resizeStart={x:e.clientX,y:e.clientY,w:el.offsetWidth,h:el.offsetHeight};});
  h.addEventListener('touchstart',e=>{e.stopPropagation();const t=e.touches[0];isResizing=true;resizeCard=el;resizeStart={x:t.clientX,y:t.clientY,w:el.offsetWidth,h:el.offsetHeight};},{passive:false});
}

function onCardDown(e){
  if(e.button!==0)return;
  const el=e.currentTarget;
  if(e.target.classList.contains('resize-h')||e.target.classList.contains('swatch'))return;
  if(tool==='arrow'){arrowFrom=el;e.stopPropagation();return;}
  const tag=e.target.tagName;
  if((tag==='TEXTAREA'||tag==='INPUT')&&el.classList.contains('editing'))return;
  e.stopPropagation();selectCard(el);isDragging=true;dragCard=el;
  const p=s2c(e.clientX,e.clientY);dragOff={x:p.x-parseFloat(el.style.left),y:p.y-parseFloat(el.style.top)};
}

// ── CARD TOUCH: tap / double-tap / long-press / drag ──────────
let cardTapTime=0, cardTapEl=null, cardTapPos={x:0,y:0}, pendingEditEl=null;
let lpTimer=null, lpTriggered=false;
const LP_DELAY=520; // ms for long press

function cancelLp(){ clearTimeout(lpTimer); lpTimer=null; }

function onCardTouch(e){
  const el=e.currentTarget;
  if(e.target.classList.contains('resize-h'))return;
  if(tool==='arrow'){
    // 既存のハイライトをクリア
    document.querySelectorAll('.card.arrow-from').forEach(c=>c.classList.remove('arrow-from'));
    arrowFrom=el;
    el.classList.add('arrow-from');
    e.stopPropagation();
    return;
  }
  if(e.touches.length>1){cancelLp();return;}

  const t=e.touches[0];
  const tag=e.target.tagName;

  // 編集中のカードはネイティブに任せる
  if(el.classList.contains('editing')&&(tag==='TEXTAREA'||tag==='INPUT'||e.target.classList.contains('note-ce')||e.target.isContentEditable)){
    cancelLp(); return;
  }

  e.stopPropagation();
  lpTriggered=false;

  // Detect double-tap on card → enter edit mode
  const now=Date.now();
  const dist=Math.hypot(t.clientX-cardTapPos.x, t.clientY-cardTapPos.y);
  if(now-cardTapTime<350 && dist<30 && cardTapEl===el){
    // Double tap → editing: pendingEditEl にセットしてtouchendで同期focus
    cancelLp();
    cardTapTime=0; cardTapEl=null;
    pendingEditEl=el;
    e.preventDefault(); // ダブルタップのズームを防止
    return;
  }
  cardTapTime=now; cardTapPos={x:t.clientX,y:t.clientY}; cardTapEl=el;

  // Long press timer
  lpTimer=setTimeout(()=>{
    lpTriggered=true;
    cancelLp();
    isDragging=false; dragCard=null;
    selectCard(el);
    showLpMenu(el, t.clientX, t.clientY);
  }, LP_DELAY);

  // Begin potential drag
  selectCard(el);
  isDragging=true; dragCard=el;
  const p=s2c(t.clientX,t.clientY);
  dragOff={x:p.x-parseFloat(el.style.left),y:p.y-parseFloat(el.style.top)};
}

function focusCardForEdit(el){
  // iOS Safari: ユーザージェスチャー内で同期的にfocusを呼ぶ
  el.classList.add('editing');
  selectCard(el);
  const ce=el.querySelector('.note-ce');
  if(ce){
    ce.contentEditable='true';
    ce.focus();
    try{
      const r=document.createRange(),s=window.getSelection();
      r.selectNodeContents(ce);r.collapse(false);
      s.removeAllRanges();s.addRange(r);
    }catch(e2){}
    return;
  }
  const ta=el.querySelector('textarea')||el.querySelector('input[type=text]:not([type=checkbox])');
  if(ta){ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length);}catch(e2){}}
}

function onCardTouchEnd(e){
  cancelLp();
  // ダブルタップで pending していた編集開始 → ここで同期focus
  if(pendingEditEl){
    const target=pendingEditEl;
    pendingEditEl=null;
    isDragging=false; dragCard=null;
    focusCardForEdit(target);
    e.preventDefault();
    return;
  }
  if(lpTriggered){ lpTriggered=false; isDragging=false; dragCard=null; return; }

  // 矢印ツール: touchend座標からターゲットカードを取得
  if(tool==='arrow' && arrowFrom){
    const ct=e.changedTouches[0];
    // タッチ中は要素が隠れているので一時的にpointer-eventsを外してhitTest
    arrowFrom.style.pointerEvents='none';
    const el2=document.elementFromPoint(ct.clientX, ct.clientY);
    arrowFrom.style.pointerEvents='';

// ── TRANSFORM ─────────────────────────────────────────────────
function s2c(sx,sy){const r=app.getBoundingClientRect();return{x:(sx-r.left-pan.x)/zoom,y:(sy-r.top-pan.y)/zoom};}

function updateTransform(){
  const t=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  canvasEl.style.transform=t; zoneLayer.style.transform=t;
  zoomTxt.textContent=Math.round(zoom*100)+'%';
  const s=28*zoom,ox=pan.x%s,oy=pan.y%s;
  document.getElementById('grid').style.backgroundSize=`${s}px ${s}px`;
  document.getElementById('grid').style.backgroundPosition=`${ox}px ${oy}px`;
  drawArrows(); drawMM();
}

// ── ARROWS ────────────────────────────────────────────────────
// カード矩形とラインの交点を返す（中心 → 方向ベクトル方向の辺との交点）
function rectEdgePoint(rect, ar, tx, ty){
  const cx=rect.left+rect.width/2-ar.left;
  const cy=rect.top+rect.height/2-ar.top;
  const hw=rect.width/2, hh=rect.height/2;
  const dx=tx-cx, dy=ty-cy;
  if(dx===0&&dy===0) return {x:cx,y:cy};
  // 各辺との交点 t を求め、最小正の t を採用
  const candidates=[];
  if(dx!==0){
    let t=(hw)/dx; if(t>0){const py=cy+t*dy;if(Math.abs(py-cy)<=hh)candidates.push({t,x:cx+t*dx,y:py});}
    t=(-hw)/dx; if(t>0){const py=cy+t*dy;if(Math.abs(py-cy)<=hh)candidates.push({t,x:cx+t*dx,y:py});}
  }
  if(dy!==0){
    let t=(hh)/dy; if(t>0){const px=cx+t*dx;if(Math.abs(px-cx)<=hw)candidates.push({t,x:px,y:cy+t*dy});}
    t=(-hh)/dy; if(t>0){const px=cx+t*dx;if(Math.abs(px-cx)<=hw)candidates.push({t,x:px,y:cy+t*dy});}
  }
  if(!candidates.length) return {x:cx,y:cy};
  candidates.sort((a,b)=>a.t-b.t);
  return {x:candidates[0].x, y:candidates[0].y};
}

function drawArrows(){
  while(asvg.children.length>1)asvg.removeChild(asvg.lastChild);
  const ar=app.getBoundingClientRect();
  const color=isDark?'#e8e4de':'#1a1917';
  const markerId=isDark?'ah-dark':'ah-light';
  arrows.forEach(a=>{
    const fr=a.from.getBoundingClientRect(),tr=a.to.getBoundingClientRect();
    const fcx=fr.left+fr.width/2-ar.left, fcy=fr.top+fr.height/2-ar.top;
    const tcx=tr.left+tr.width/2-ar.left, tcy=tr.top+tr.height/2-ar.top;
    // 始点: fromカードの端（to方向）
    const p1=rectEdgePoint(fr,ar,tcx,tcy);
    // 終点: toカードの端（from方向）
    const p2=rectEdgePoint(tr,ar,fcx,fcy);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    line.setAttribute('stroke',color);
    line.setAttribute('stroke-width','1.6');
    line.setAttribute('marker-end',`url(#${markerId})`);
    asvg.appendChild(line);
  });
}

function drawMM(){
  const W=108,H=68,sc=0.035*zoom;
  mmCtx.clearRect(0,0,W,H);mmCtx.fillStyle='rgba(240,237,232,.6)';mmCtx.fillRect(0,0,W,H);
  cards.forEach(({el})=>{
    const x=parseFloat(el.style.left)*sc+pan.x*0.035+W/4;
    const y=parseFloat(el.style.top)*sc+pan.y*0.035+H/4;
    mmCtx.fillStyle=el.classList.contains('board-card')?'rgba(91,79,212,.5)':'rgba(91,79,212,.28)';
    mmCtx.beginPath();if(mmCtx.roundRect)mmCtx.roundRect(x,y,el.offsetWidth*sc,el.offsetHeight*sc,2);else mmCtx.rect(x,y,el.offsetWidth*sc,el.offsetHeight*sc);mmCtx.fill();
  });
}

app.addEventListener('touchstart',e=>{
  // 2本指は常にピンチ開始として処理（カード上でも）
  if(e.touches.length===2){
    e.preventDefault();
    const t0=e.touches[0],t1=e.touches[1];
    lastPinchDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    isPanning=false; isDragging=false; dragCard=null;
    return;
  }
  if(e.target.closest('.card')||e.target.closest('.zone'))return;
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    const now=Date.now();
    if(now-lastTapTime<320&&Math.hypot(t.clientX-lastTapPos.x,t.clientY-lastTapPos.y)<30){
      const p=s2c(t.clientX,t.clientY);
      const type=tool==='select'||tool==='arrow'||tool==='zone'?'note':tool;
      buildCard(type,p.x-88,p.y-38);
      lastTapTime=0;return;
    }
    lastTapTime=now;lastTapPos={x:t.clientX,y:t.clientY};
    if(tool==='zone'){
      isDrawingZone=true;const r=app.getBoundingClientRect();
      drawZoneStart={x:t.clientX-r.left,y:t.clientY-r.top};
      zGhost.style.cssText=`display:block;left:${t.clientX}px;top:${t.clientY}px;width:0;height:0;`;
      return;
    }
    isPanning=true;panStart={x:t.clientX-pan.x,y:t.clientY-pan.y};selectCard(null);
  }
},{passive:false});

app.addEventListener('touchmove',e=>{
  // 2本指ピンチは常に処理（カード上でも）
  if(e.touches.length===2){
    e.preventDefault();
    isPanning=false; isDragging=false;
    const t0=e.touches[0],t1=e.touches[1];
    const dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    if(lastPinchDist===0){lastPinchDist=dist;return;}
    const f=dist/lastPinchDist; lastPinchDist=dist;
    const mx=(t0.clientX+t1.clientX)/2,my=(t0.clientY+t1.clientY)/2;
    const r=app.getBoundingClientRect(),cx=mx-r.left,cy=my-r.top;
    pan.x=cx-(cx-pan.x)*f;pan.y=cy-(cy-pan.y)*f;
    zoom=Math.min(5,Math.max(.1,zoom*f));updateTransform();return;
  }
  if(e.target.closest('.card')||e.target.closest('.zone'))return;
  e.preventDefault();
  if(e.touches.length===1&&isPanning){
    const t=e.touches[0];pan.x=t.clientX-panStart.x;pan.y=t.clientY-panStart.y;updateTransform();
  }
  if(isDrawingZone&&e.touches.length===1){
    const t=e.touches[0],r=app.getBoundingClientRect(),cx=t.clientX-r.left,cy=t.clientY-r.top;
    const x=Math.min(drawZoneStart.x,cx)+r.left,y=Math.min(drawZoneStart.y,cy)+r.top;
    zGhost.style.left=x+'px';zGhost.style.top=y+'px';zGhost.style.width=Math.abs(cx-drawZoneStart.x)+'px';zGhost.style.height=Math.abs(cy-drawZoneStart.y)+'px';
  }
},{passive:false});

app.addEventListener('touchend',e=>{
  // ゾーン描画中は.card/.zone判定をスキップ
  if(!isDrawingZone&&(e.target.closest('.card')||e.target.closest('.zone')))return;
  isPanning=false;
  if(isDrawingZone){
    isDrawingZone=false;zGhost.style.display='none';
    if(e.changedTouches.length){
      const t=e.changedTouches[0],r=app.getBoundingClientRect();
      const cx=t.clientX-r.left,cy=t.clientY-r.top;
      const w=Math.abs(cx-drawZoneStart.x),h=Math.abs(cy-drawZoneStart.y);
      if(w>40&&h>40){const sx=Math.min(drawZoneStart.x,cx),sy=Math.min(drawZoneStart.y,cy);const p=s2c(sx+r.left,sy+r.top);const d={id:++zoneId,x:p.x,y:p.y,w:w/zoom,h:h/zoom,colorIdx:0,label:''};buildZone(d);scheduleSave();}
    }
  }
  // arrow touch end

    const t=e.changedTouches[0];const tgt=document.elementFromPoint(t.clientX,t.clientY)?.closest('.card');
    if(tgt&&tgt!==arrowFrom){const fId=+arrowFrom.dataset.id,tId=+tgt.dataset.id;if(!arrows.find(a=>a.fromId===fId&&a.toId===tId)){arrows.push({fromId:fId,toId:tId,from:arrowFrom,to:tgt});drawArrows();scheduleSave();}}
    arrowFrom=null;
  }
},{passive:false});

document.addEventListener('keydown',e=>{

  if((e.key==='Delete'||e.key==='Backspace')&&!ed) deleteCard(selected, false);

      selected.classList.remove('editing');

  if(!ed){const m={v:'select',n:'note',t:'text',i:'image',l:'link',d:'todo',b:'board',a:'arrow',z:'zone'};if(m[e.key.toLowerCase()])setTool(m[e.key.toLowerCase()]);}
});

}

// 「入力」「削除」ボタン: touchstartでselectedが解除される前にキャプチャ
(function(){
  function safeTap(btnId, fn){
    const btn = document.getElementById(btnId);
    if(!btn) return;
    let _sel = null;
    // touchstartでselectedをキャプチャ＆伝播阻止
    btn.addEventListener('touchstart', e=>{
      _sel = selected;
      e.stopPropagation();
    }, {passive: true});
    btn.addEventListener('touchend', e=>{
      e.preventDefault();
      e.stopPropagation();
      fn(_sel);
      _sel = null;
    }, {passive: false});
    btn.addEventListener('click', ()=> fn(selected));
  }

  safeTap('mob-edit', (sel)=>{
    if(!sel){ showToast('カードを選択してください'); return; }
    const type = cards.find(c=>c.el===sel)?.data?.type;
    if(type==='board'){ enterBoard(sel); return; }
    sel.classList.add('editing');
    const ce = sel.querySelector('.note-ce');
    if(ce){
      ce.contentEditable = 'true';
      focusCardForEdit(sel);
      return;
    }
    const ta = sel.querySelector('textarea') || sel.querySelector('input[type=text]:not([type=checkbox])');
    if(ta){ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length);}catch(e2){}}
  });

  safeTap('mob-del', (sel)=>{
    if(!sel){ showToast('カードを選択してください'); return; }
    const isBoard = sel.classList.contains('board-card');
    const msg = isBoard
      ? 'このボードを削除しますか？（中のカードも消えます）'
      : 'このカードを削除しますか？';
    if(confirm(msg)) deleteCard(sel, true);
  });
})();

// ── FORMAT TOOLBAR ─────────────────────────────────────────
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const fmtBar   = document.getElementById('fmt-bar');
const fbBold   = document.getElementById('fb-bold');
const fbItalic = document.getElementById('fb-italic');
const fbSize   = document.getElementById('fb-size');
const fbInc    = document.getElementById('fb-inc');
const fbDec    = document.getElementById('fb-dec');
const fbClr    = document.getElementById('fb-clr');
let fmtTarget  = null;

function updateFmtBar(){
  if(!fmtTarget)return;
  fbBold.classList.toggle('on', document.queryCommandState('bold'));
  fbItalic.classList.toggle('on', document.queryCommandState('italic'));
  const sel=window.getSelection();
  if(sel&&sel.rangeCount){
    const n=sel.getRangeAt(0).startContainer;
    const el2=n.nodeType===3?n.parentElement:n;
    const fs=parseFloat(window.getComputedStyle(el2).fontSize)||13;
    fbSize.value=Math.round(fs);
  }
}

function applyFontSize(px){
  if(!fmtTarget)return;
  fmtTarget.focus();
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);

  // 既存の同一fontSize spanを解除してフラット化してから新しいspanで包む
  const frag=range.extractContents();
  // frag内の全spanのfont-sizeを削除してフラットなテキストに近づける
  frag.querySelectorAll('span').forEach(s=>{
    s.style.fontSize='';
    if(!s.style.cssText.trim())s.replaceWith(...s.childNodes);
  });
  const span=document.createElement('span');
  span.style.fontSize=px+'px';
  span.appendChild(frag);
  range.insertNode(span);

  // 選択範囲を span 全体に復元
  const newRange=document.createRange();
  newRange.selectNodeContents(span);
  sel.removeAllRanges();
  sel.addRange(newRange);

  updateFmtBar();
  scheduleSave();
}

function execFmt(cmd){
  if(!fmtTarget)return;
  fmtTarget.focus();
  document.execCommand(cmd,false,null);
  updateFmtBar();
  scheduleSave();
}

fbBold.addEventListener('mousedown',e=>{e.preventDefault();execFmt('bold');});
fbItalic.addEventListener('mousedown',e=>{e.preventDefault();execFmt('italic');});
fbClr.addEventListener('mousedown',e=>{e.preventDefault();document.execCommand('removeFormat');updateFmtBar();scheduleSave();});
fbInc.addEventListener('mousedown',e=>{
  e.preventDefault();
  const v=Math.min(72,(parseInt(fbSize.value)||13)+2);
  fbSize.value=v;applyFontSize(v);
});
fbDec.addEventListener('mousedown',e=>{
  e.preventDefault();
  const v=Math.max(8,(parseInt(fbSize.value)||13)-2);
  fbSize.value=v;applyFontSize(v);
});
fbSize.addEventListener('change',()=>{
  const v=Math.max(8,Math.min(72,parseInt(fbSize.value)||13));
  fbSize.value=v;applyFontSize(v);
});
fbSize.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();fbSize.blur();if(fmtTarget)fmtTarget.focus();}});
fbSize.addEventListener('mousedown',e=>e.stopPropagation());
fbSize.addEventListener('focus',e=>e.stopPropagation());

document.addEventListener('selectionchange',()=>{
  const sel=window.getSelection();
  const active=document.activeElement;
  // fmtBar内（サイズ入力含む）にフォーカスがある間は状態を維持
  if(fmtBar.contains(active)) return;
  if(active&&active.classList.contains('note-ce')&&sel&&!sel.isCollapsed){
    fmtTarget=active;
    fmtBar.classList.add('visible');
    updateFmtBar();
  } else if(active&&active.classList.contains('note-ce')&&sel&&sel.isCollapsed){
    // カーソルだけ（選択なし）→ツールバーは閉じる、ただしフォーカスは維持
    fmtBar.classList.remove('visible');
    fmtTarget=null;
  } else if(!fmtBar.contains(active)){
    fmtBar.classList.remove('visible');
    fmtTarget=null;
  }
});

// Ctrl+B / Ctrl+I
document.addEventListener('keydown',e=>{
  if(fmtTarget&&(e.ctrlKey||e.metaKey)){
    if(e.key==='b'){e.preventDefault();execFmt('bold');}
    if(e.key==='i'){e.preventDefault();execFmt('italic');}
  }
});

// Safari iOS: gestureイベントでネイティブピンチズームを完全無効化
document.addEventListener('gesturestart',  e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e=>e.preventDefault(), {passive:false});
document.addEventListener('gestureend',    e=>e.preventDefault(), {passive:false});
